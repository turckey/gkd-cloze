<title>公大名解 · 阶梯挖空</title>
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --ink:#1f2333; --muted:#6b7280; --line:#e6e8f0;
  --pri:#4f46e5; --pri-soft:#eef0ff; --ok:#10b981; --ok-soft:#e8fbf3;
  --bad:#ef4444; --bad-soft:#fdeeee; --warn:#f59e0b; --warn-soft:#fff7e8;
  --shadow:0 6px 24px rgba(31,35,51,.07);
}
html[data-theme="dark"]{
  --bg:#12141c; --card:#1b1e29; --ink:#e7e9f3; --muted:#9aa0b4; --line:#2a2f3f;
  --pri:#8b8bff; --pri-soft:#232645; --ok:#34d399; --ok-soft:#123a2e;
  --bad:#f87171; --bad-soft:#3a1d1d; --warn:#fbbf24; --warn-soft:#3a2f12;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.5px;white-space:nowrap;flex:0 0 auto}
.brand .sub{font-weight:600;font-size:12px;color:var(--pri);margin-left:6px;
  background:var(--pri-soft);padding:2px 7px;border-radius:999px}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;
  flex-shrink:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 14px;border-radius:9px;font-size:14px;color:var(--muted);
  white-space:nowrap;flex:0 0 auto}
.tabs button.active{background:var(--card);color:var(--pri);font-weight:700;box-shadow:var(--shadow)}
main{max-width:820px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card + .card{margin-top:14px}
h1,h2,h3{margin:0;line-height:1.35}
h2{font-size:18px;margin-bottom:10px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-weight:600;font-size:15px;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ghost{background:transparent}
.btn.soft{background:var(--pri-soft);color:var(--pri);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.learn{background:var(--warn-soft);color:#b4791a}
.chip.new{background:var(--pri-soft);color:var(--pri)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#7c7bff);border-radius:999px;transition:.4s}
.chaps{margin-top:6px}
.subhead{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px;font-size:15px}
.subhead .muted{font-size:12px}
.chap{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);
  border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;transition:.15s}
.chap:hover{transform:translateY(-1px);border-color:var(--pri)}
.chap .info{flex:1;min-width:0}
.chap .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .meta{font-size:12px;color:var(--muted)}
.chap .pct{font-weight:800;color:var(--pri);font-size:15px;min-width:48px;text-align:right}
.dots{display:flex;gap:6px;margin:14px 0 4px}
.dot{flex:1;height:6px;border-radius:999px;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.now{background:var(--pri)}
.sentence{font-size:19px;line-height:2.5;letter-spacing:.2px;margin:6px 0 2px}
.blank{font:inherit;font-size:17px;text-align:center;padding:1px 4px;border-radius:8px;
  border:1.5px solid var(--pri);background:var(--pri-soft);color:var(--ink);outline:none;
  vertical-align:baseline;margin:0 2px;min-width:2.6em;line-height:1.7;transition:.15s}
.blank:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
.blank.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blank.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .3s}
.blank.near{background:var(--warn-soft);border-color:var(--warn);color:#b4791a}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;outline:none}
.search:focus{border-color:var(--pri)}
.orig{font-size:16px;line-height:2;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:14px}
.orig code,code{background:var(--pri-soft);color:var(--pri);padding:1px 5px;border-radius:5px;font-size:13px}
.blank.hinted{background:var(--warn-soft);border-color:var(--warn)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.hintbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:15px}
.opt:hover{border-color:var(--pri)}
.opt b{color:var(--pri)}
.recall label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.recall textarea{width:100%;min-height:74px;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;resize:vertical;outline:none}
.recall textarea:focus{border-color:var(--pri)}
.diff{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:2}
.diff mark{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 1px}
.fb{position:sticky;bottom:0;z-index:10;margin-top:16px;padding:12px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.fb .line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb .score{font-weight:800;font-size:17px}
.fb .score.ok{color:var(--ok)} .fb .score.bad{color:var(--bad)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table td,.table th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.table th{color:var(--muted);font-weight:600;font-size:12px}
.setting{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:none}
.setting .lab{flex:1;font-size:14px}
.setting input[type=text],.setting input[type=password],.setting input[type=number],.setting select{
  padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;max-width:220px;width:100%}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111827;color:#fff;
  padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.hidden{display:none}
.modal .box{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.modal .box pre{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.8;margin:0}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.spark{width:100%;height:96px}
.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:520px){
  main{padding:14px 12px 100px}
  .sentence{font-size:17px;line-height:2.4}
  .tabs button{padding:6px 10px;font-size:13px}
  .brand .sub{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">阶梯挖空<span class="sub" id="sampleTag">全量</span></div>
  <nav class="tabs">
    <button data-nav="home" class="active">学习</button>
    <button data-nav="lib">原文</button>
    <button data-nav="dash">看板</button>
    <button data-nav="settings">设置</button>
  </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="box">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h3 id="modalTitle" style="font-size:16px"></h3>
    <button class="btn small ghost" id="modalClose">关闭</button>
  </div>
  <div id="modalBody" style="margin-top:10px"></div>
</div></div>
<script src="data.js"></script>
<script>
'use strict';
const D = window.QUIZ_DATA || {items:[],meta:{}};
const WORDS = D.wordpool || {};
const META = D.meta || {};
const LS = 'gkd-cloze-v2';
const BUILTIN = (D.items || []).map(x => Object.assign({builtin:true}, x));
let ITEMS = BUILTIN.slice();

/* ---------------- state ---------------- */
function defaultState(){
  return { items:{}, log:[], custom:[], streak:{last:'',n:0},
    settings:{theme:'light', font:16, dailyNew:12, fastReview:true, knowledgeUrl:'',
      apiBase:'https://api.deepseek.com/v1', apiKey:'', model:'deepseek-chat'} };
}
function loadState(){
  const base = defaultState();
  try{
    const raw = localStorage.getItem(LS) || localStorage.getItem('gkd-cloze-v1');
    if(raw){
      const o = JSON.parse(raw);
      return {items:o.items||{}, log:o.log||[], custom:o.custom||[], streak:o.streak||{last:'',n:0},
              settings:Object.assign(base.settings, o.settings||{})};
    }
  }catch(e){}
  return base;
}
let S = loadState();
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){ toast('本地存储失败'); } }

/* ---------------- custom items / ladder builder ---------------- */
function hash36(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h*33)^str.charCodeAt(i))>>>0; } return h.toString(36); }
function customKey(e){ return (e.subject||'补充')+'|'+(e.chapter||'补充')+'|'+(e.name||''); }

function normText(s){
  return String(s||'').normalize('NFKC')
    .replace(/[\s\u3000]/g,'')
    .replace(/[\u3000-\u303F\uFF00-\uFFEF!"#$%&'()*+,\-./:;<=>?@\[\\\]^_`{|}~]/g,'')
    .toLowerCase();
}
function stripBlankChars(t){ return t.replace(/[的地得]/g,''); }
const norm = s => stripBlankChars(normText(s));

function chunkClauses(body){
  return body.split(/(?<=[，。；：！？])/).map(s=>s.trim()).filter(Boolean);
}
function autoLadder(body, name){
  // 分段挖空：把释义按标点切成 3 段，每轮挖一段里的关键词短语
  const clauses = chunkClauses(body);
  const segs = clauses.length ? clauses : [body];
  const n = Math.min(3, Math.max(2, Math.ceil(segs.length/2)));
  const stages = [];
  const per = Math.ceil(segs.length / n);
  for(let k=0;k<n;k++){
    const part = segs.slice(k*per, (k+1)*per).join('');
    // 从这一段里挑 2~4 个 2-8 字的中文短语，尽量分散
    const cand = [];
    const re = /[\u4e00-\u9fa5]{2,8}/g; let m;
    while((m=re.exec(part))){
      const w = m[0];
      if(w.length < 2) continue;
      if(/^(的|是|指|和|与|及|或|等|在|为|对|从|被|把|所|其|也|都|就|而|但|则|之|有|无|不|可)/.test(w)) continue;
      cand.push({w, i:m.index});
    }
    if(!cand.length) continue;
    const pick = [];
    const step = Math.max(1, Math.floor(cand.length/4));
    for(let i=0;i<cand.length && pick.length<4;i+=step) pick.push(cand[i]);
    // 定位到 body 的绝对偏移
    const base = body.indexOf(part);
    if(base < 0) continue;
    const blanks = [];
    let pos = 0;
    for(const c of pick){
      let at = part.indexOf(c.w, pos);
      if(at < 0) continue;
      blanks.push({s: base+at, e: base+at+c.w.length, w: c.w});
      pos = at + c.w.length;
    }
    blanks.sort((a,b)=>a.s-b.s);
    if(!blanks.length) continue;
    const tier = ['G1','G2','G3','G4'][k] || 'G4';
    stages.push({kind:'cloze', tier, label:'第'+(stages.length+1)+'轮 · 分段挖空（第'+(k+1)+'段）', blanks});
  }
  if(!stages.length){
    // 兜底：整段挖第一个 4~8 字短语
    const m = body.match(/[\u4e00-\u9fa5]{4,8}/);
    if(m){ const s = body.indexOf(m[0]); stages.push({kind:'cloze', tier:'G4', label:'第1轮 · 挖关键词', blanks:[{s, e:s+m[0].length, w:m[0]}]}); }
  }
  // 默写轮
  const recSegs = [];
  let buf='', len=0;
  for(const cl of (clauses.length?clauses:[body])){
    if(len + cl.length > 72 && buf){ recSegs.push(buf); buf=cl; len=cl.length; }
    else { buf += cl; len += cl.length; }
  }
  if(buf) recSegs.push(buf);
  const segments = recSegs.map(s=>{
    let hint = '对象/结果';
    if(/^(按照|根据|依照|依据|为了|以|通过|运用|采用|使用|在|经|由|对|针对|由于)/.test(s)) hint='状语/依据/手段';
    else if(/^(但是|同时|因此|从而|并且|而且|或者|包括|即|所谓|是指)/.test(s)) hint='逻辑/条件';
    else if(/(国家机关|公安机关|人民检察院|人民法院|人民警察|行为人|当事人|公民|单位)/.test(s)) hint='主体/行为';
    return {hint, answer:s};
  });
  stages.push({kind:'recall', label:'最后1轮 · 只给标题默写', segments});
  return stages;
}
function normalizeCustom(e, i){
  const name = String(e.name||'未命名').trim();
  const body = String(e.body||'').trim();
  const subject = String(e.subject||'补充内容').trim();
  const chapter = String(e.chapter||'导入').trim();
  const id = e.id || ('c-' + hash36(subject+chapter+name+body));
  const stages = (e.stages && e.stages.length) ? e.stages : autoLadder(body, name);
  return {id, subject, chapter, name, body, chars:body.length, stages, builtin:false};
}
function mergeCustom(list, mode){  const existing = new Map((S.custom||[]).map(x=>[customKey(x), x]));
  let added = 0, updated = 0;
  for(const raw of list){
    if(!raw || !raw.name || !raw.body) continue;
    const k = customKey(raw);
    if(existing.has(k)){
      if(mode==='replace'){ existing.set(k, normalizeCustom(Object.assign({}, raw, {id: existing.get(k).id}))); updated++; }
    } else {
      const item = normalizeCustom(raw);
      existing.set(k, item); added++;
    }
  }
  S.custom = [...existing.values()];
  rebuildItems();
  save();
  return {added, updated, total:S.custom.length};
}
function readKnowledgeFile(f){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      const list = Array.isArray(data) ? data : (data.items||data.entries||[]);
      if(!list.length) throw new Error('没有条目');
      const res = mergeCustom(list, 'keep');
      toast(`已导入：新增 ${res.added} 条，共 ${res.total} 条补充内容`);
      render();
    }catch(e){ toast('导入失败：' + e.message); }
  };
  r.onerror = () => toast('读取文件失败');
  r.readAsText(f);
}
function rebuildItems(){
  ITEMS = BUILTIN.concat((S.custom||[]).map(x=>normalizeCustom(x)));
}
rebuildItems();
function prog(id){ if(!S.items[id]) S.items[id]={stage:0,cleared:false,ef:2.5,rep:0,ivl:0,due:0,weak:{},seen:0,lastQ:null}; return S.items[id]; }

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function chapterKey(it){ return it.subject+'|'+it.chapter; }
function chapters(){
  const map = new Map();
  ITEMS.forEach(it=>{
    const k = chapterKey(it);
    if(!map.has(k)) map.set(k, {key:k, subject:it.subject, title:it.chapter, items:[]});
    map.get(k).items.push(it);
  });
  // 原文缺失的章节占位（META 中 0 条）
  (META.chapters||[]).forEach(c=>{
    const k = c.subject + '|' + c.title;
    if(!map.has(k) && !c.count) map.set(k, {key:k, subject:c.subject, title:c.title, items:[]});
  });
  return [...map.values()];
}
function itemState(it){
  const p = S.items[it.id];
  if(!p || !p.stage) return 'new';
  if(p.cleared) return 'done';
  return 'learn';
}
function dueItems(){
  const now = Date.now();
  return ITEMS.filter(it=>{ const p=S.items[it.id]; return p && p.cleared && p.due && p.due<=now; })
              .sort((a,b)=>(S.items[a.id].due||0)-(S.items[b.id].due||0));
}
function accuracy(items){
  const log = S.log || [];
  const l = items ? log.filter(x=>items.includes(x.id)) : log;
  if(!l.length) return null;
  const ok = l.reduce((a,b)=>a+(b.ok?1:0),0);
  return Math.round(ok/l.length*100);
}

/* ---------------- screens ---------------- */
let current = { screen:'home', chapter:null, play:null, queue:[] };

function buildTodayQueue(){
  const due = dueItems();
  const news = ITEMS.filter(it=>itemState(it)==='new').slice(0, S.settings.dailyNew||8);
  return [...due.map(it=>({id:it.id, review:true})), ...news.map(it=>({id:it.id, review:false}))];
}
function startQueue(q){
  current.queue = q || [];
  nextInQueue();
}
function nextInQueue(){
  if(!current.queue || !current.queue.length){
    current.play = null; current.screen = 'home'; render();
    toast('本轮队列已清空 🎉'); return;
  }
  const nxt = current.queue.shift();
  startItem(nxt.id, { review: !!nxt.review });
}
function wrongQueue(){
  return ITEMS.filter(it=>{
    const p = S.items[it.id];
    if(!p) return false;
    const weak = p.weak && Object.values(p.weak).some(v=>v>0);
    return weak || (p.lastQ!=null && p.lastQ<3);
  }).map(it=>({id:it.id, review:true}));
}
function weakQueue(){
  const tally = {};
  Object.values(S.items).forEach(p=>{ if(p&&p.weak) for(const k in p.weak) tally[k]=(tally[k]||0)+p.weak[k]; });
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  if(!top) return [];
  const tier = top[0];
  return ITEMS.filter(it=>{ const p=S.items[it.id]; return p&&p.weak&&p.weak[tier]; })
              .map(it=>({id:it.id, review:true}));
}

function setScreen(name){ current.screen=name; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.nav===name)); render(); }

function render(){
  const app = $('#app');
  document.documentElement.setAttribute('data-theme', S.settings.theme||'light');
  const tag = $('#sampleTag');
  if(tag) tag.textContent = ITEMS.length + ' 条 · ' + chapters().length + ' 章';
  if(current.screen==='home') app.innerHTML = viewHome();
  else if(current.screen==='chapter') app.innerHTML = viewChapter();
  else if(current.screen==='play') app.innerHTML = viewPlay();

  else if(current.screen==='orig') app.innerHTML = viewOrig();
  else if(current.screen==='dash') app.innerHTML = viewDash();
  else if(current.screen==='settings') app.innerHTML = viewSettings();
  bind();
}

function groupBySubject(cs){
  const order = (META.subjects && META.subjects.length) ? META.subjects : [...new Set(cs.map(c=>c.subject))];
  const map = new Map();
  cs.forEach(c=>{ if(!map.has(c.subject)) map.set(c.subject, []); map.get(c.subject).push(c); });
  return order.filter(s=>map.has(s)).map(s=>({subject:s, list:map.get(s)}));
}

function renderSentence(it, st){
  let html='', cur=0;
  st.blanks.forEach((b,i)=>{

    const w = Math.max(3, Math.min(12, b.w.length));
    html += `<input class="blank" data-b="${i}" data-len="${b.w.length}" style="width:${w*1.15}em" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">`;
    cur = b.e;
  });
  html += esc(it.body.slice(cur));
  return `<div class="sentence">${html}</div>`;
}
let recallCtx = null;
function renderRecall(it, st){
  recallCtx = it;
  return `<div class="recall" id="recallBox">
    <div class="muted" style="font-size:13px">只给标题，回忆整条名解。分 ${st.segments.length} 段填写：</div>
    ${st.segments.map((s,i)=>`<label>第 ${i+1} 段 · 线索：${esc(s.hint)}</label>
      <textarea data-seg="${i}" placeholder="在这里写出你对第 ${i+1} 段的回忆…"></textarea>`).join('')}

/* ---------- checking ---------- */
function lev(a,b){
  a=String(a); b=String(b);
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[n];
}
function nearEnough(input, want){
  const a=norm(input), b=norm(want);
  if(a===b) return 'exact';
  if(b.length >= 4 && a.length >= 3 && lev(a,b) <= 1) return 'near';
  return null;
}
function checkCloze(){
  const P=current.play; const it=P.it; const st=it.stages[P.idx];
  const inputs=[...document.querySelectorAll('.blank')];
  const fb = $('#fbZone');
  if(!inputs.length) return;
  const empty = inputs.filter(i=>!i.value.trim());
  if(empty.length){ toast('还有空没填完'); return; }
  let ok=0, wrongIdx=[];
  inputs.forEach((inp,i)=>{
    const want=st.blanks[i].w;
    const r = nearEnough(inp.value, want);
    if(r){
      inp.classList.add(r==='near'?'near':'ok'); inp.classList.remove('bad'); inp.readOnly=true; ok++;
    }else{
      inp.classList.add('bad'); wrongIdx.push(i);
    }
  });
  P.attempt++;
  if(ok===inputs.length){
    const used = Math.round((Date.now()-P.t0)/1000);
    const hintsUsed = P.hints;
    logResult(it, P.idx, true, hintsUsed, used, st.tier||'');
    P.hints=0; P.attempt=0; P.t0=Date.now();
    fb.innerHTML = `<div class="fb"><div class="line">
      <div class="score ok">全对 ✓</div>
      <div class="muted" style="font-size:13px">本轮用时 ${used}s · 提示 ${hintsUsed} 次</div>
      <div class="grow"></div>
      <button class="btn primary" data-action="nextStage">继续下一轮 →</button>
    </div></div>`;
    bindFb();
    return;
  }
  // wrong
  const wrongRole = st.tier||'';
  if(P.attempt>=2){
    inputs.forEach((inp,i)=>{ if(wrongIdx.includes(i)){ inp.value=st.blanks[i].w; inp.classList.remove('bad'); inp.classList.add('hinted'); } });
    fb.innerHTML = `<div class="fb"><div class="line">
      <div class="score bad">${ok}/${inputs.length} 正确 · 已显示错误空</div>
      <div class="grow"></div>
      <button class="btn" data-action="retryStage">重来本轮</button>
      <button class="btn primary" data-action="nextStage">下一轮 →</button>
    </div></div>`;
    logResult(it, P.idx, false, P.hints, Math.round((Date.now()-P.t0)/1000), wrongRole);
    P.hints=0; P.attempt=0;
    bindFb();
  }else{
    fb.innerHTML = `<div class="fb"><div class="line">
      <div class="score bad">${ok}/${inputs.length} 正确</div>
      <div class="muted" style="font-size:13px">红色为空错，再试一次</div>
      <div class="grow"></div>
      <button class="btn" data-action="check">再检查</button>
    </div></div>`;
    bindFb();
    const first = inputs.find((_,i)=>wrongIdx.includes(i));
    if(first){ first.focus(); first.select(); }
  }
}
function nextStage(){
  const P=current.play; const it=P.it;
  const p=prog(it.id);
  p.stage = Math.max(p.stage||0, P.idx+1);
  if(P.idx+1>=it.stages.length){ p.cleared = true; p.seen=(p.seen||0)+1; schedule(it); }
  save();
  if(P.idx+1>=it.stages.length){ current.play = {it, idx:it.stages.length-1, review:false, done:true}; }
  else { P.idx++; P.attempt=0; P.hints=0; P.t0=Date.now(); }
  render();
}
function showAnswer(){
  const P=current.play; const it=P.it; const st=it.stages[P.idx];
  if(st.kind!=='cloze') return;
  document.querySelectorAll('.blank').forEach((inp,i)=>{ inp.value=st.blanks[i].w; inp.classList.add('hinted'); inp.readOnly=true; });
  logResult(it, P.idx, false, P.hints+1, Math.round((Date.now()-P.t0)/1000), st.tier||'');
  const fb=$('#fbZone');
  fb.innerHTML = `<div class="fb"><div class="line">
    <div class="muted" style="font-size:13px">已显示答案，本轮记为未通过，进入下一轮继续。</div>
    <div class="grow"></div><button class="btn primary" data-action="nextStage">下一轮 →</button>
  </div></div>`;
  bindFb();
}

/* ---------- recall ---------- */
function lcsMatch(a,b){
  const A=[...a], B=[...b];
  const m=A.length, n=B.length;
  const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j] = A[i-1]===B[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  }
  // backtrack to find matched positions in b
  const matched=new Set(); let i=m,j=n;
  while(i>0&&j>0){
    if(A[i-1]===B[j-1]){ matched.add(j-1); i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  return {len:dp[m][n], matched};
}
function submitRecall(){
  const P=current.play; const it=P.it; const st=it.stages[P.idx];
  const areas=[...document.querySelectorAll('.recall textarea')];
  const segs=st.segments;
  let totLen=0, totMatch=0;
  const rows = segs.map((s,i)=>{
    const user = areas[i].value;
    const A = norm(s.answer), B = norm(user);
    totLen += A.length;
    if(!B.length) return {i, user, ok:0, answer:s.answer, matched:new Set(), extra:0};
    const r = lcsMatch(A,B);
    totMatch += r.len;
    return {i, user, ok:r.len, answer:s.answer, matched:r.matched, extra: Math.max(0, B.length - r.len)};
  });
  const pct = totLen? Math.round(totMatch/totLen*100):0;
  const fb=$('#fbZone');
  // 标点/空格在比对前已忽略，多打的标点不会产生连锁错误
  const detail = rows.map(r=>{
    const A=norm(r.answer);
    let html='';
    for(let k=0;k<A.length;k++){ html += r.matched.has(k)? esc(A[k]) : `<mark>${esc(A[k])}</mark>`; }
    const segPct = A.length? Math.round(r.ok/A.length*100):0;
    return `<div style="margin-bottom:10px">
      <div class="muted" style="font-size:12px">第 ${r.i+1} 段 · 命中 ${segPct}%${r.extra?` · 多写/顺序不同 ${r.extra} 字（已忽略）`:''}</div>
      <div class="diff">${html||'<span class="muted">（空）</span>'}</div></div>`;
  }).join('');
  const q = pct>=95?5:pct>=85?4:pct>=70?3:pct>=50?2:1;
  logResult(it, P.idx, pct>=70, P.hints, Math.round((Date.now()-P.t0)/1000), 'recall', q);
  const p=prog(it.id);
  p.cleared = pct>=70 ? true : p.cleared;
  p.seen=(p.seen||0)+1;
  schedule(it, q);
  save();
  const nv = nextReviewText(p);
  fb.innerHTML = `<div class="fb">
    <div class="line">
      <div class="score ${pct>=70?'ok':'bad'}">默写命中 ${pct}%</div>
      <div class="muted" style="font-size:13px">红色为缺失/写错的字 · 标点不计</div>
      <div class="grow"></div>
      <button class="btn" data-action="retryRecall">再默一遍</button>
      <button class="btn primary" data-action="finishItem">完成本条 →</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">下次复习：${esc(nv)}</div>
    <div style="margin-top:12px">${detail}</div>
    <div class="row" style="margin-top:4px"><button class="btn small ghost" data-action="aiGradeRecall">AI 批改这段默写</button></div>
  </div>`;
  bindFb();
}

/* ---------- srs（SM-2） ---------- */
function schedule(it, q){
  const p = prog(it.id);
  q = (q==null) ? (p.lastQ!=null?p.lastQ:4) : q;
  let ef = p.ef || 2.5;
  ef = Math.max(1.3, ef + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  p.ef = Math.round(ef*100)/100;
  if(q < 3){ p.rep = 0; p.ivl = 1; }
  else {
    p.rep = (p.rep||0) + 1;
    if(p.rep === 1) p.ivl = 1;
    else if(p.rep === 2) p.ivl = 3;
    else p.ivl = Math.max(1, Math.round((p.ivl||1) * p.ef));
  }
  p.lastQ = q;
  p.reviewed = (p.reviewed||0) + 1;
  p.due = Date.now() + p.ivl*86400000;
}
function nextReviewText(p){
  if(!p || !p.due) return '未开始';
  const ms = p.due - Date.now();
  if(ms <= 0) return '今天到期（建议复习）';
  const d = Math.ceil(ms/86400000);
  return d + ' 天后复习';
}
function logResult(it, stageIdx, ok, hints, sec, tier, q){
  S.log.push({id:it.id, ts:Date.now(), stage:stageIdx, ok:ok?1:0, hints:hints||0, sec:sec||0, tier:tier||'', q:q||0});
  if(S.log.length>4000) S.log = S.log.slice(-3000);
  // weak tracking
  const p=prog(it.id);
  if(!ok && tier){ p.weak[tier]=(p.weak[tier]||0)+1; }
  save();
}

  if(libSearch){
    libSearch.oninput = () => {
      const pos = libSearch.selectionStart;
      current.libQuery = libSearch.value;
      render();
      const again = $('#libSearch');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    };
  }
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action, b));
  document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>hint(b.dataset.hint, b));

    toast('已保存');
  });

  const inputs=[...document.querySelectorAll('.blank')];
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{ inp.classList.remove('bad'); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault();
        if(i<inputs.length-1) inputs[i+1].focus();
        else checkCloze();
      }
      if(e.key==='Tab' && i===inputs.length-1 && !e.shiftKey){ e.preventDefault(); checkCloze(); }
    });
  });
  if(current.screen==='play' && current.play && current.play.it.stages[current.play.idx].kind==='cloze'){
    const first=document.querySelector('.blank'); if(first && !current.play.done) first.focus();
  }
}
function bindFb(){
  document.querySelectorAll('#fbZone [data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));
}
function action(name, btn){
  const P=current.play;
  switch(name){
    case 'startToday': {
      const q = buildTodayQueue();
      if(!q.length){ toast('今天的任务已清空，去章节里重刷或做薄弱强化吧'); break; }
      startQueue(q); break; }
    case 'startRandom': {
      const pool=ITEMS.filter(it=>itemState(it)!=='done');
      const it=(pool.length?pool:ITEMS)[Math.floor(Math.random()*(pool.length||ITEMS.length))];
      if(it) startItem(it.id); break; }
    case 'weakBlitz': {
      const q = weakQueue();
      if(!q.length){ toast('还没有薄弱成分记录，先刷几条吧'); break; }
      startQueue(q); break; }
    case 'wrongOnly': {
      const q = wrongQueue();
      if(!q.length){ toast('还没有错题记录'); break; }
      startQueue(q); break; }
    case 'quit': current.queue=[]; current.play=null; current.screen='home'; render(); break;
    case 'peek': {
      if(!P) break;
      P.hints++;
      openModal('原文 · '+P.it.name, '<div class="orig" style="font-size:16px;line-height:2">'+esc(P.it.body)+'</div>');
      break; }
    case 'studyThis': { const id=btn&&btn.dataset.id; if(id) startItem(id); break; }
    case 'check': checkCloze(); break;
    case 'reveal': showAnswer(); break;
    case 'nextStage': nextStage(); break;
    case 'retryStage': P.attempt=0; P.hints=0; P.t0=Date.now(); render(); break;
    case 'submitRecall': submitRecall(); break;
    case 'retryRecall': render(); break;
    case 'finishItem': current.play=null; save(); nextInQueue(); break;
    case 'aiExplain': aiExplain(); break;
    case 'aiGradeRecall': aiGradeRecall(); break;
    case 'aiWeak': aiWeak(); break;
    case 'toggleTheme': S.settings.theme = S.settings.theme==='dark'?'light':'dark'; save(); render(); break;
    case 'toggleFast': S.settings.fastReview = !S.settings.fastReview; save(); render(); break;
    case 'importKnowledge': {
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
      inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; readKnowledgeFile(f); };
      inp.click(); break; }
    case 'pullKnowledge': {
      const url = (S.settings.knowledgeUrl||'').trim();
      if(!url){ toast('先在设置里填本机地址'); break; }
      toast('正在从本机拉取…');
      fetch(url, {cache:'no-store'})
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(data=>{
          const list = Array.isArray(data) ? data : (data.items||data.entries||[]);
          if(!list.length) throw new Error('没有条目');
          const res = mergeCustom(list, 'keep');
          toast(`更新完成：新增 ${res.added} 条，共 ${res.total} 条补充内容`);
          render();
        })
        .catch(e=>toast('连接失败：'+e.message));
      break; }
    case 'historyOfUpdate': openModal('怎么从本机更新内容', `<div class="orig" style="font-size:14px;line-height:1.9">
1. 电脑上双击项目里的「启动知识更新服务.bat」，会显示类似 http://192.168.1.5:8899/data.json 的地址。<br>
2. 手机连同一个 Wi-Fi，把这个地址填进设置里的输入框，点「立即从本机拉取」。<br>
3. 电脑上更新 knowledge\\data.json（格式见下）后，手机再点一次即可增量导入。<br><br>
格式：<br><code>{"items":[{"subject":"刑法学","chapter":"补充","name":"名解名称","body":"完整释义"}]}</code><br>
也可以直接是数组，或把 新名解.txt（每行：名称&lt;TAB&gt;释义）用 tools\\make_knowledge_json.py 转换。</div>`); break;
    case 'export': {
      const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gkd-cloze-backup.json'; a.click(); toast('已导出'); break; }
    case 'import': {
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
        r.onload=()=>{ try{ const o=JSON.parse(r.result); S=Object.assign(defaultState(),o,{settings:Object.assign(defaultState().settings,o.settings||{})}); rebuildItems(); save(); toast('导入成功'); render(); }catch(e){ toast('文件格式不对'); } }; r.readAsText(f); };
      inp.click(); break; }
    case 'reset': if(confirm('确定清空所有进度、记录和导入的内容？')){ S=defaultState(); rebuildItems(); save(); current.queue=[]; render(); toast('已重置'); } break;
  }
}

/* ---------- hints ---------- */
function hint(kind){
  const P=current.play; if(!P) return;
  const it=P.it, st=it.stages[P.idx];
  if(st.kind!=='cloze') return;
  const inputs=[...document.querySelectorAll('.blank')];
  const idx = inputs.findIndex(i=>!i.readOnly && !i.value.trim());
  const targetIdx = idx>=0 ? idx : 0;
  const b = st.blanks[targetIdx];
  const inp = inputs[targetIdx];
  if(!b||!inp) return;
  if(kind==='first'){ inp.value=b.w[0]; inp.classList.add('hinted'); inp.focus(); inp.setSelectionRange(1,1); P.hints++; }
  else if(kind==='len'){ $('#hintZone').innerHTML = `<div class="card" style="margin-top:12px;padding:10px 14px;font-size:14px">这个空是 <b>${b.w.length}</b> 个字，答案来自：${esc(st.label)}</div>`; P.hints++; }
  else if(kind==='choice'){
    P.hints++;
    const cands = buildChoices(b.w);
    $('#hintZone').innerHTML = `<div class="card" style="margin-top:12px"><div class="muted" style="font-size:13px;margin-bottom:8px">四选一（点了会自动填入）</div>
      ${cands.map((c,i)=>`<button class="opt" data-pick="${i}"><b>${'ABCD'[i]}</b> ${esc(c)}</button>`).join('')}</div>`;
    document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{
      const v=cands[Number(btn.dataset.pick)];
      inp.value=v; inp.focus(); inp.setSelectionRange(v.length,v.length);
      $('#hintZone').innerHTML='';
    });
  }
  else if(kind==='answer'){ showAnswer(); }
}
function buildChoices(w){
  const len=w.length;
  const pool = (WORDS[String(len)]||WORDS[String(len+1)]||WORDS[String(len-1)]||[]).filter(x=>x!==w);
  const picks=[];
  while(picks.length<3 && pool.length){
    const x=pool[Math.floor(Math.random()*pool.length)];
    if(!picks.includes(x)&&x!==w) picks.push(x);
  }
  const cands=[w,...picks];
  for(let i=cands.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cands[i],cands[j]]=[cands[j],cands[i]]; }
  return cands;
}

/* ---------- ai ---------- */
function openModal(title, html){
  $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html; $('#modal').classList.remove('hidden');
}
$('#modalClose').onclick=()=>$('#modal').classList.add('hidden');
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.add('hidden'); };

async function aiChat(prompt){
  const st=S.settings;
  if(!st.apiKey){ throw new Error('请先到「设置」填入大模型 API Key'); }
  const base=(st.apiBase||'').replace(/\/+$/,'');
  const res=await fetch(base+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+st.apiKey},
    body:JSON.stringify({model:st.model, temperature:0.3, messages:[{role:'system',content:'你是公安学/刑法学/刑事诉讼法学考研辅导老师，回答简洁准确，用中文。'},{role:'user',content:prompt}]})
  });
  if(!res.ok){ throw new Error('接口返回 '+res.status+'，请检查地址/Key/模型名或跨域限制'); }
  const j=await res.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'(空响应)';
}
function aiLoading(title){
  openModal(title,'<div class="muted">调用中…（首次可能较慢，若浏览器提示跨域请换接口地址）</div>');
}
async function aiExplain(){
  const P=current.play; if(!P) return; const it=P.it;
  aiLoading('AI 拆解 · '+it.name);
  try{
    const txt=await aiChat(`请拆解这条考研名解，帮我记住：
名解：${it.name}
原文：${it.body}

请输出：1) 句子结构（主语/宾语/状语/谓语/逻辑关系分别是什么）；2) 3 个记忆锚点（关键词链）；3) 一个口诀或联想；4) 最容易背错的地方。不超过 300 字。`);
    openModal('AI 拆解 · '+it.name,'<pre>'+esc(txt)+'</pre>');
  }catch(e){ openModal('调用失败','<div class="muted">'+esc(e.message)+'</div>'); }
}
async function aiGradeRecall(){
  const P=current.play; if(!P) return; const it=P.it;
  const areas=[...document.querySelectorAll('.recall textarea')].map(a=>a.value).join('\n');
  aiLoading('AI 批改 · '+it.name);
  try{
    const txt=await aiChat(`请批改我的名解默写。
名解：${it.name}
标准答案：${it.body}
我的默写：${areas||'(空)'}

请指出：漏掉的关键得分点、写错的地方、可接受的同义表述；给 1-5 分评价。不超过 250 字。`);
    openModal('AI 批改 · '+it.name,'<pre>'+esc(txt)+'</pre>');
  }catch(e){ openModal('调用失败','<div class="muted">'+esc(e.message)+'</div>'); }
}
async function aiWeak(){
  const weak={};
  Object.entries(S.items).forEach(([id,p])=>{ if(p&&p.weak) for(const k in p.weak) weak[k]=(weak[k]||0)+(p.weak[k]); });
  const nameOf={G1:'主语',G2:'宾语',G3:'状语',G4:'谓语/逻辑',recall:'整条默写'};
  const summary=Object.entries(weak).map(([k,v])=>nameOf[k]+' 错 '+v+' 次').join('；')||'暂无错误记录';
  aiLoading('AI 薄弱点分析');
  try{
    const txt=await aiChat(`我在用阶梯挖空背公安大学考研名解（公安学基础/刑法/刑诉，共 395 条）。当前错误统计：${summary}。
请给出一份 7 天强化计划：每天练什么成分、多少题、怎么自查。不超过 300 字。`);
    openModal('AI 薄弱点分析','<pre>'+esc(txt)+'</pre>');
  }catch(e){ openModal('调用失败','<div class="muted">'+esc(e.message)+'</div>'); }
}

(function boot(){
  const h=location.hash.replace('#','');
  if(h.startsWith('play=')){ const id=h.slice(5); if(ITEMS.some(x=>x.id===id)){ startItem(id); return; } }
